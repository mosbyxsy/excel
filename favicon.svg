<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="轻表格图标">
  <defs>
    <linearGradient id="background" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20A47F"/>
      <stop offset="1" stop-color="#0B5A47"/>
    </linearGradient>
    <linearGradient id="shine" x1="20" y1="15" x2="47" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset="1" stop-color="#DDF6ED" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板在小尺寸标签页中仍能保持清晰轮廓。 -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#background)"/>
  <path d="M17 14.5h25.5L49 21v28.5H17z" fill="url(#shine)"/>
  <path d="M42.5 14.5V21H49" fill="#BFEBDD"/>

  <!-- 加粗的表格轮廓和首列强调色用于表达 Excel/CSV 查看器。 -->
  <path d="M17 25h32M17 33h32M17 41h32M27 21v28M37 21v28" fill="none" stroke="#14775F" stroke-width="2"/>
  <rect x="17" y="21" width="10" height="28.5" fill="#14775F" opacity=".14"/>
  <path d="M17 21h32v28.5H17z" fill="none" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="1.5"/>
</svg>
